[project]
name = "sbench"
version = "0.1.0"
description = "Local-file smoke suite for comparing agent frameworks on small operations tasks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlxtend>=0.23.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "textual>=1.0.0",
    "voluntas>=0.1.3",
]

[project.scripts]
sbench = "sbench.cli:main"
sbench-bdi = "sbench.bdi.toy:sync_main"
test = "pytest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--cov=sbench --cov-branch --cov-report=term --cov-report=html"
